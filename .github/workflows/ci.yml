name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.28.0
  # sha256 of gitleaks_8.28.0_linux_x64.tar.gz from the official release's
  # checksums file; bump together with GITLEAKS_VERSION.
  GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history so the gitleaks scan covers every commit. No
      # partial-clone filter: gitleaks reads every historical blob, and the
      # whole repo is only a few MiB.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: "npm"

      # Secret scan over the full history. The version is pinned so the rule
      # set is predictable instead of whatever happens to be latest.
      - name: Scan history for secrets (gitleaks)
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xz -C /usr/local/bin -f /tmp/gitleaks.tar.gz gitleaks
          gitleaks version
          gitleaks git . --no-banner --redact

      - run: npm ci

      # Browser-mode (vitest + playwright) tests for the SDK run in
      # chromium; harmless while only node-environment packages exist.
      - run: npx playwright install --with-deps chromium

      - run: npx nx format:check --all

      - run: npx nx run-many -t build test lint typecheck

      # The SKILL, the plugin bundles and the marketplace manifests are all
      # generated from the tool registry. Regenerating must be a no-op, or a
      # tool was added without `npm run generate` and the published skill
      # documents a server that no longer matches.
      - name: Agent assets are up to date
        run: |
          npm run generate
          git diff --exit-code -- SKILL.md plugins .claude-plugin .agents \
            || { echo "::error::Generated agent assets are stale. Run 'npm run generate' and commit."; exit 1; }

  # Deploys only after `main` has gone green on this exact commit, and only
  # from the default branch: a pull request, including one from a fork, must
  # never be able to reach the account.
  #
  # Every step is gated on the token existing, so a fork can run CI without
  # a red deploy job it could never have passed.
  deploy:
    needs: main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - run: npm ci
        if: env.CLOUDFLARE_API_TOKEN != ''

      # The Worker serves apps/web's build as its static assets, so the site
      # has to exist on disk before wrangler reads the assets directory.
      - run: npx nx run-many -t build
        if: env.CLOUDFLARE_API_TOKEN != ''

      # --env production carries our routes and LV_SERVE_URL. The base
      # config is deliberately free of both, because that is what someone
      # deploying this repository to their own account gets.
      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run deploy:production

      # A deploy that returns 200 to wrangler can still be broken: routes
      # take a moment to propagate, and a bundle that imports something the
      # runtime lacks only fails on the first real request.
      - name: Verify the deployment answers
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: node scripts/smoke-deploy.mjs https://livevariant.com
