name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.28.0
  # sha256 of gitleaks_8.28.0_linux_x64.tar.gz from the official release's
  # checksums file; bump together with GITLEAKS_VERSION.
  GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The Postgres store runs its conformance suite twice: against PGlite
    # (in-process, no server) and against this one. Only the second proves
    # the concurrency cases, because PGlite is a single connection and the
    # races serialize, which is exactly how a read-modify-write adapter
    # sneaks through. Without this service that half of the suite skips.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: livevariant
          POSTGRES_PASSWORD: livevariant
          POSTGRES_DB: livevariant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Full history so the gitleaks scan covers every commit. No
      # partial-clone filter: gitleaks reads every historical blob, and the
      # whole repo is only a few MiB.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: "npm"

      # Secret scan over the full history. The version is pinned so the rule
      # set is predictable instead of whatever happens to be latest.
      - name: Scan history for secrets (gitleaks)
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xz -C /usr/local/bin -f /tmp/gitleaks.tar.gz gitleaks
          gitleaks version
          gitleaks git . --no-banner --redact -v

      # The runner's npm is whatever its Node patch release bundles, and
      # npm versions disagree about what belongs in a lockfile: npm 11.6.2
      # writes one without the nested @emnapi/*@2.0.0-alpha.3 entries that
      # @rolldown/binding-wasm32-wasi pins, and the 11.16.0 that came with
      # Node 24.18.0 rejects that lock outright ("Missing: @emnapi/core@
      # 2.0.0-alpha.3 from lock file"). Pinning the reader to the same npm
      # that writes the lock (scripts/release.mjs enforces the same field)
      # is what stops a Node patch bump from turning main red.
      - name: Pin npm to the version the lockfile is written with
        run: |
          npm i -g "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm --version

      - run: npm ci

      # Chromium is a fresh ~130MB download per run; cache it keyed on
      # the exact Playwright version (install is a no-op on a warm
      # cache, and --with-deps still apt-installs shared libraries).
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Browser-mode (vitest + playwright) tests run in chromium.
      - run: npx playwright install --with-deps chromium

      - run: npx nx format:check --all

      - run: npx nx run-many -t build lint typecheck

      # Serialized on purpose: three vitest suites launch real Chromium
      # instances, and nx's default parallelism time-slices them on the
      # 2-vCPU runner until the slowest test (the last E2E of the
      # biggest suite) starves past its timeout. One suite at a time
      # gives each browser the whole machine.
      - run: npx nx run-many -t test --parallel=1
        env:
          LV_TEST_POSTGRES_URL: postgres://livevariant:livevariant@localhost:5432/livevariant_test

      # The SKILL, the plugin bundles and the marketplace manifests are all
      # generated from the tool registry. Regenerating must be a no-op, or a
      # tool was added without `npm run generate` and the published skill
      # documents a server that no longer matches.
      - name: Agent assets are up to date
        run: |
          npm run generate
          git diff --exit-code -- skills plugins .claude-plugin .agents \
            || { echo "::error::Generated agent assets are stale. Run 'npm run generate' and commit."; exit 1; }
